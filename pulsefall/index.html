*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;touch-action:none}#g{position:fixed;inset:0;background:#050816;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:max(17px,env(safe-area-inset-top));left:18px;right:18px;z-index:5;display:none;justify-content:space-between}.lab{font-size:9px;letter-spacing:1.7px;color:#95a4c9;font-weight:900}.score{font-size:27px;font-weight:1000}.combo{text-align:right;color:#ffd85b;font-size:23px;font-weight:1000}.energy{margin-top:3px;color:#6feaff;font-size:12px;font-weight:900}.mode{position:absolute;z-index:5;left:50%;top:max(22px,env(safe-area-inset-top));transform:translateX(-50%);font-size:10px;font-weight:1000;letter-spacing:1.4px;color:#e3ebff;display:none}.bar{position:absolute;z-index:5;left:18px;right:18px;top:max(80px,calc(env(safe-area-inset-top) + 63px));height:5px;background:#ffffff12;border-radius:99px;overflow:hidden;display:none}.fill{height:100%;background:linear-gradient(90deg,#62ecff,#8b68ff,#ff67c9)}.bossWrap{position:absolute;z-index:6;left:18px;right:18px;top:max(99px,calc(env(safe-area-inset-top) + 82px));display:none}.bossName{text-align:center;font-size:10px;font-weight:1000;letter-spacing:2px;color:#ff9cb6;margin-bottom:5px}.bossTrack{height:8px;border-radius:99px;background:#ffffff14;overflow:hidden}.bossFill{height:100%;background:linear-gradient(90deg,#ff426f,#ff9a4f)}.hint{position:absolute;bottom:max(17px,env(safe-area-inset-bottom));left:18px;right:18px;z-index:5;display:none;justify-content:space-between;color:#ffffff38;font-size:9px;font-weight:900;letter-spacing:1.8px}.ov{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#050816df;overflow:auto}.card{width:100%;max-width:430px;text-align:center}.logo{font-size:37px;font-weight:1000;letter-spacing:2.5px}.logo span{background:linear-gradient(90deg,#62ecff,#9a76ff,#ff67c9);-webkit-background-clip:text;color:transparent}.tag{margin-top:7px;color:#91a0c6;font-size:10px;font-weight:900;letter-spacing:1.6px}.orb{width:110px;height:110px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 35% 28%,#fff 0 5%,#68ecff 6% 22%,#6b61ff 48%,#251249 76%);box-shadow:0 0 28px #67e8f9,0 0 70px #8c65ff66;position:relative;animation:bob 1.8s ease-in-out infinite}.orb:after{content:"";position:absolute;width:142px;height:30px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-15deg);border:5px solid #ff69c9;border-radius:50%;box-shadow:0 0 16px #ff69c9}@keyframes bob{50%{transform:translateY(-6px)}}.info{color:#bcc7df;line-height:1.48;font-size:14px}.btn{margin-top:17px;width:min(270px,84vw);height:54px;border:0;border-radius:18px;background:linear-gradient(90deg,#5eeaff,#8566ff 55%,#ff6ac8);color:white;font-size:13px;font-weight:1000;letter-spacing:1.2px}.btn.alt{margin-top:9px;background:#ffffff0d;border:1px solid #ffffff19}.modeBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.modeBtn{padding:15px 8px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff0b;color:#fff}.modeBtn b{display:block;font-size:15px}.modeBtn span{display:block;margin-top:5px;font-size:9px;color:#9aa8c9;line-height:1.35}.wallet{margin-top:14px;color:#6feaff;font-weight:900;font-size:12px}.small{margin-top:8px;color:#8796bb;font-size:10px}.shopTitle{font-size:24px;font-weight:1000}.tabs{display:flex;gap:8px;margin-top:15px}.tab{flex:1;padding:9px;border-radius:11px;background:#ffffff0b;border:1px solid #ffffff16;color:#aeb9d3;font-size:10px;font-weight:900}.tab.on{background:#6c63ff;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.up{padding:12px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff16;text-align:left}.up .ico{font-size:22px}.up h3{font-size:12px;margin:6px 0 3px}.up p{font-size:9px;line-height:1.35;color:#9ba8c8;min-height:35px;margin:0}.lvl{float:right;color:#72efff;font-size:9px}.up button{width:100%;margin-top:8px;padding:9px 4px;border:0;border-radius:10px;background:#7067ff;color:#fff;font-size:9px;font-weight:900}.up button:disabled{opacity:.3}.equip{outline:2px solid #6feaff}.over{color:#ff7093;font-size:16px;letter-spacing:2.5px;font-weight:1000}.big{font-size:53px;font-weight:1000;margin-top:8px}.stats{display:flex;gap:9px;justify-content:center;margin-top:18px}.stat{width:124px;height:68px;border:1px solid #ffffff16;border-radius:16px;background:#ffffff0a;display:flex;flex-direction:column;justify-content:center}.stat b{font-size:19px}.stat span{font-size:8px;color:#91a0c7;letter-spacing:1px;margin-top:3px;font-weight:900}#toast{position:absolute;z-index:8;left:50%;top:27%;transform:translate(-50%,-50%);font-size:22px;font-weight:1000;pointer-events:none}
</style></head><body><div id="g"><canvas id="c"></canvas><div class="hud" id="hud"><div><div class="lab">SCORE</div><div class="score" id="score">0</div><div class="energy" id="eg">◆ 0</div></div><div><div class="combo" id="combo">×1</div><div class="lab" style="text-align:right">COMBO</div></div></div><div class="mode" id="modeTxt"></div><div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="bossWrap" id="bossWrap"><div class="bossName" id="bossName"></div><div class="bossTrack"><div class="bossFill" id="bossFill"></div></div></div><div class="hint" id="hint"><span>‹ TAP LEFT</span><span>TAP RIGHT ›</span></div><div id="toast"></div><div class="ov" id="ov"></div></div><script>
(()=>{const q=id=>document.getElementById(id),C=q('c'),X=C.getContext('2d'),ov=q('ov'),hud=q('hud'),scoreEl=q('score'),eg=q('eg'),comboEl=q('combo'),bar=q('bar'),fill=q('fill'),hint=q('hint'),toast=q('toast'),modeTxt=q('modeTxt'),bossWrap=q('bossWrap'),bossName=q('bossName'),bossFill=q('bossFill');let W,H,dpr,phase='menu',gameMode='endless',level=1,lane=0,target=0,score=0,energy=0,combo=1,boost=0,hyper=0,items=[],parts=[],stars=[],spawn=0,start=0,last=0,world=0,shieldUsed=0,raf=0,boss=null,bossTimer=0,droneTimer=0;const base={wallet:0,best:0,shield:0,magnet:0,charge:0,multi:0,core:0,maxLevel:1,owned:['none'],equipped:'none'};let old=JSON.parse(localStorage.pfEvo||'{}'),S={...base,...old,...JSON.parse(localStorage.pfEvo3||'{}')};S.owned=S.owned||['none'];const save=()=>localStorage.pfEvo3=JSON.stringify(S),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H*.7,s:Math.random()*1.6+.3,a:Math.random()*.65+.2}))}addEventListener('resize',resize);resize();function vib(v){try{navigator.vibrate&&navigator.vibrate(v)}catch{}}function evo(){return S.shield+S.magnet+S.charge+S.multi+S.core}
const upgrades=[['shield','🛡️','Shield','Absorb crashes.',[35,90,220]],['magnet','🧲','Magnet','Pull crystals from nearby lanes.',[30,80,190]],['charge','⚡','Hyper Charge','Reach Hyper Mode faster.',[25,75,180]],['multi','✦','Multiplier','Permanent score bonus.',[40,110,250]],['core','◉','Core Evolution','Bigger Pulse + more energy.',[45,130,300]]],gear=[['none','◌','No Gear','Pure Pulse.',0],['drone','🤖','Attack Drone','Auto-damages bosses.',90],['gravity','🌀','Gravity Ring','Extra crystal pull.',110],['armor','🧿','Nova Armor','One extra crash save.',140],['prism','🔺','Prism Core','Hyper hurts bosses faster.',175]];
function menu(){phase='menu';hud.style.display=bar.style.display=hint.style.display=modeTxt.style.display=bossWrap.style.display='none';ov.style.display='flex';ov.innerHTML='<div class="card"><div class="logo"><span>PULSEFALL</span> EVOLVE</div><div class="tag">CHOOSE YOUR RUN</div><div class="orb"></div><div class="modeBtns"><button class="modeBtn" id="levels"><b>LEVELS</b><span>Finite stages. Every level ends with a boss.</span></button><button class="modeBtn" id="endless"><b>ENDLESS</b><span>Survive forever. Pure high-score mode.</span></button></div><button class="btn alt" id="shop">⚙︎ WORKSHOP & LOADOUT</button><div class="wallet">◆ '+S.wallet+' ENERGY</div><div class="small">MAX LEVEL '+S.maxLevel+' · BEST '+S.best.toLocaleString()+' · '+gear.find(g=>g[0]===S.equipped)[2].toUpperCase()+'</div></div>';levels.onclick=()=>run('levels',S.maxLevel);endless.onclick=()=>run('endless',1);shop.onclick=()=>workshop('up')}
function workshop(tab='up'){phase='shop';let body=(tab==='up'?upgrades:gear).map(a=>{if(tab==='up'){let[k,ic,n,d,costs]=a,lv=S[k],max=lv>=3,c=max?'MAX':costs[lv];return '<div class="up"><div class="ico">'+ic+'<span class="lvl">LV '+lv+'/3</span></div><h3>'+n+'</h3><p>'+d+'</p><button data-up="'+k+'" '+(max||S.wallet<c?'disabled':'')+'>'+(max?'MAXED':'UPGRADE ◆ '+c)+'</button></div>'}let[k,ic,n,d,cost]=a,owned=S.owned.includes(k),eq=S.equipped===k;return '<div class="up '+(eq?'equip':'')+'"><div class="ico">'+ic+(eq?'<span class="lvl">EQUIPPED</span>':'')+'</div><h3>'+n+'</h3><p>'+d+'</p><button data-gear="'+k+'" '+(!owned&&S.wallet<cost?'disabled':'')+'>'+(eq?'EQUIPPED':owned?'EQUIP':'UNLOCK ◆ '+cost)+'</button></div>'}).join('');ov.innerHTML='<div class="card"><div class="shopTitle">PULSE WORKSHOP</div><div class="wallet">◆ '+S.wallet+' ENERGY</div><div class="tabs"><button class="tab '+(tab==='up'?'on':'')+'" id="tu">UPGRADES</button><button class="tab '+(tab==='gear'?'on':'')+'" id="tg">GEAR</button></div><div class="grid">'+body+'</div><button class="btn alt" id="back">BACK</button></div>';tu.onclick=()=>workshop('up');tg.onclick=()=>workshop('gear');back.onclick=menu;ov.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>buyUp(b.dataset.up));ov.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>gearAct(b.dataset.gear))}
function buyUp(k){let u=upgrades.find(z=>z[0]===k),lv=S[k];if(lv>=3)return;let c=u[4][lv];if(S.wallet<c)return;S.wallet-=c;S[k]++;save();workshop('up')}function gearAct(k){let g=gear.find(z=>z[0]===k),cost=g[4];if(!S.owned.includes(k)){if(S.wallet<cost)return;S.wallet-=cost;S.owned.push(k)}S.equipped=k;save();workshop('gear')}
function run(mode,lv){gameMode=mode;level=lv;phase='play';ov.style.display='none';hud.style.display='flex';bar.style.display='block';hint.style.display='flex';modeTxt.style.display='block';bossWrap.style.display='none';modeTxt.textContent=mode==='levels'?'LEVEL '+level:'ENDLESS';lane=target=0;score=energy=0;combo=1;boost=hyper=0;items=[];parts=[];spawn=0;start=last=performance.now();world=0;shieldUsed=0;boss=null;bossTimer=droneTimer=0;update();msg(mode==='levels'?'LEVEL '+level:'ENDLESS','#fff');cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function finish(win=false){phase='over';cancelAnimationFrame(raf);S.best=Math.max(S.best,score|0);let bank=Math.floor(energy*(1+S.core*.25))+(win?35*level:0);S.wallet+=bank;if(win&&level>=S.maxLevel)S.maxLevel=Math.min(25,level+1);save();ov.style.display='flex';let primary=win?'NEXT LEVEL':'RETRY',action=win?()=>run('levels',S.maxLevel):()=>run(gameMode,level);ov.innerHTML='<div class="card"><div class="over">'+(win?'BOSS DEFEATED!':'RUN OVER')+'</div><div class="big">'+(score|0).toLocaleString()+'</div><div class="stats"><div class="stat"><b>◆ '+bank+'</b><span>ENERGY BANKED</span></div><div class="stat"><b>'+S.maxLevel+'</b><span>MAX LEVEL</span></div></div><button class="btn" id="primary">'+primary+'</button><button class="btn alt" id="home">MODE SELECT</button><button class="btn alt" id="upg">⚙︎ WORKSHOP</button></div>';primary.onclick=action;home.onclick=menu;upg.onclick=()=>workshop('gear')}
function road(z,l=0){let t=Math.pow(clamp(z,0,1),1.55),y=lerp(H*.22,H*1.03,t),half=lerp(W*.05,W*.53,t),cx=W/2+Math.sin(world*.35)*8*(1-t);return{x:cx+l*half*.57,y,sc:lerp(.12,1.35,t),half,cx}}
function bg(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,gameMode==='levels'?'#070922':'#04101d');g.addColorStop(.58,hyper?'#281347':'#0b1230');g.addColorStop(1,'#080710');X.fillStyle=g;X.fillRect(0,0,W,H);for(let s of stars){X.globalAlpha=s.a;X.fillStyle='#fff';X.fillRect(s.x,s.y,s.s,s.s)}X.globalAlpha=1;for(let i=0;i<14;i++){let p=road(i/13);X.strokeStyle='rgba(110,120,255,'+(.05+i/13*.18)+')';X.beginPath();X.moveTo(p.cx-p.half,p.y);X.lineTo(p.cx+p.half,p.y);X.stroke()}for(let l of [-1.5,-.5,.5,1.5]){let a=road(0,l),b=road(1,l);X.strokeStyle='rgba(95,232,255,.14)';X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke()}}
function add(kind,l,z=.02){items.push({kind,l,z,spin:Math.random()*6.28})}function spawnWave(sec){let danger=Math.min(.82,.56+sec*.004+(gameMode==='levels'?level*.015:0));if(Math.random()<danger){let l=[-1,0,1][Math.random()*3|0];add('block',l);if(sec>16&&Math.random()<.25)add('block',[-1,0,1].filter(v=>v!==l)[Math.random()*2|0],-.06)}else{add('gem',[-1,0,1][Math.random()*3|0]);if(Math.random()<.5)add('gem',[-1,0,1][Math.random()*3|0],-.07)}}
function drawItem(o){let p=road(o.z,o.l),s=p.sc;if(o.kind==='block'){let q=34*s;X.save();X.translate(p.x,p.y);X.rotate(.18+o.spin);X.fillStyle='#ff537e';X.shadowColor='#ff537e';X.shadowBlur=18*s;X.fillRect(-q/2,-q/2,q,q);X.strokeStyle='#ffc4d2';X.strokeRect(-q/2,-q/2,q,q);X.restore()}else{let q=14*s;X.save();X.translate(p.x,p.y);X.rotate(o.spin);X.fillStyle='#67efff';X.shadowColor='#67efff';X.shadowBlur=18*s;X.beginPath();X.moveTo(0,-q);X.lineTo(q,0);X.lineTo(0,q);X.lineTo(-q,0);X.closePath();X.fill();X.restore()}}
function drawPlayer(){let p=road(.84,lane),r=24+S.core*3+(hyper?5:0);X.save();X.translate(p.x,p.y);let g=X.createRadialGradient(-7,-8,2,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.25,'#6ef2ff');g.addColorStop(.7,hyper?'#ff69ca':'#655fff');g.addColorStop(1,'#25154c');X.fillStyle=g;X.shadowColor=hyper?'#ff69ca':'#65eaff';X.shadowBlur=35;X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.strokeStyle='#efffff';X.lineWidth=4;X.stroke();for(let i=0;i<1+Math.floor(evo()/4);i++){X.strokeStyle='rgba(180,130,255,'+(.5-i*.1)+')';X.beginPath();X.ellipse(0,0,r+10+i*7,(r+10+i*7)*.32,world*2+i,0,Math.PI*2);X.stroke()}if(S.shield+(S.equipped==='armor'?1:0)>shieldUsed){X.strokeStyle='#7dffc7';X.lineWidth=3;X.beginPath();X.arc(0,0,r+15,0,Math.PI*2);X.stroke()}if(S.equipped==='drone'){X.fillStyle='#ffd85b';X.beginPath();X.arc(34*Math.cos(world*3),14*Math.sin(world*3),6,0,Math.PI*2);X.fill()}X.restore()}
function startBoss(){items=[];boss={hp:14+level*6,max:14+level*6,l:0,t:0};bossWrap.style.display='block';bossName.textContent=['VOID MANTIS','CRIMSON EYE','GRAVITY WARDEN','NEON HYDRA'][level%4]+' · LV '+level;msg('BOSS INCOMING!','#ff86a5');vib([30,30,70])}
function drawBoss(dt){if(!boss)return;boss.t+=dt;boss.l=Math.sin(boss.t*.0014)*.76;let p=road(.22,boss.l),r=32+level*2;X.save();X.translate(p.x,p.y);X.rotate(world);X.fillStyle='#ff426f';X.shadowColor='#ff426f';X.shadowBlur=35;for(let i=0;i<6;i++){X.rotate(Math.PI/3);X.fillRect(r*.55,-5,r*.75,10)}X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(0,0,r*.28,0,Math.PI*2);X.fill();X.restore();bossTimer+=dt;if(bossTimer>780){bossTimer=0;add('block',[-1,0,1][Math.random()*3|0],.28)}droneTimer+=dt;if(S.equipped==='drone'&&droneTimer>650){droneTimer=0;damageBoss(1)}if(hyper&&bossTimer<40)damageBoss(S.equipped==='prism'?1.2:.6);bossFill.style.width=Math.max(0,boss.hp/boss.max*100)+'%'}
function damageBoss(d){if(!boss)return;boss.hp-=d;score+=25*d;if(boss.hp<=0){boss=null;bossWrap.style.display='none';score+=1000*level;energy+=10+level*2;msg('BOSS DEFEATED!','#7dffc7');setTimeout(()=>finish(true),550)}}
function burst(px,py,col){for(let i=0;i<14;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,l:1,c:col})}function msg(t,c){toast.textContent=t;toast.style.color=c;toast.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:850})}function update(){scoreEl.textContent=(score|0).toLocaleString();eg.textContent='◆ '+energy;comboEl.textContent='×'+combo;fill.style.width=boost+'%'}
function loop(t){if(phase!=='play')return;let dt=Math.min(33,t-last);last=t;let sec=(t-start)/1000;world+=dt/1000;lane=lerp(lane,target,Math.min(1,dt*.012));let speed=Math.min(.014,.006+sec*.00006)+(hyper?.0025:0);if(gameMode==='levels'&&!boss&&sec>24+level*3)startBoss();spawn+=dt;if(!boss&&spawn>Math.max(390,780-sec*4)){spawn=0;spawnWave(sec)}bg();let crash=false;for(let i=items.length-1;i>=0;i--){let o=items[i];o.z+=speed*dt/16;o.spin+=.05*dt/16;drawItem(o);if(o.z>.78&&o.z<.91){let dist=Math.abs(o.l-lane),mag=.22+S.magnet*.34+(S.equipped==='gravity'?.35:0);if(o.kind==='gem'&&dist<mag){let p=road(o.z,o.l);energy++;combo=Math.min(9,combo+1);boost=Math.min(100,boost+15+S.charge*7);score+=70*combo*(1+S.multi*.15);burst(p.x,p.y,'#67efff');items.splice(i,1);if(boost>=100&&!hyper){boost=0;hyper=3200;msg('HYPER MODE!','#ff79d3')}continue}if(o.kind==='block'&&dist<.27){let protection=S.shield+(S.equipped==='armor'?1:0);if(protection>shieldUsed){shieldUsed++;items.splice(i,1);msg('SHIELD SAVE!','#78ffc5');continue}else crash=true}}if(o.z>1.08)items.splice(i,1)}if(hyper>0){hyper-=dt;if(hyper<0)hyper=0}if(boss)drawBoss(dt);drawPlayer();for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.04;X.globalAlpha=p.l;X.fillStyle=p.c;X.fillRect(p.x,p.y,3,3);if(p.l<=0)parts.splice(i,1)}X.globalAlpha=1;score+=dt/16*(1+S.multi*.15)*(hyper?2:1);update();if(crash)return finish(false);raf=requestAnimationFrame(loop)}
q('g').addEventListener('pointerdown',e=>{if(phase!=='play'||e.target.tagName==='BUTTON')return;target=clamp(target+(e.clientX<W/2?-1:1),-1,1);vib(5)});menu()})();
</script></body></html>
