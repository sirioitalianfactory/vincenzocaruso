function run(mode,lv){gameMode=mode;level=lv;phase='play';startMusic();ov.style.display='none';hud.style.display='flex';bar.style.display='block';hint.style.display='flex';modeTxt.style.display='block';bossWrap.style.display='none';modeTxt.textContent=mode==='levels'?'LEVEL '+level+' · '+currentWorld().name:'ENDLESS · '+currentWorld().name;lane=target=0;score=energy=0;combo=1;boost=hyper=0;items=[];parts=[];spawn=0;start=last=performance.now();world=0;shieldUsed=0;boss=null;bossPending=false;shots=0;projectiles=[];bossTimer=droneTimer=0;fire.style.display='none';fire.classList.remove('ready');specter=null;nextSpecter=3500+Math.random()*3500;update();msg(mode==='levels'?'LEVEL '+level:'ENDLESS','#fff');cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function finish(win=false){if(phase!=='play'&&phase!=='victory')return;phase='over';stopMusic();fire.style.display='none';bossWrap.style.display='none';cancelAnimationFrame(raf);S.best=Math.max(S.best,score|0);let bank=Math.floor(energy*(1+S.core*.25))+(win?35*level:0);S.wallet+=bank;let earned=0;if(win&&gameMode==='levels'){earned=1+(energy>=8?1:0)+(score>=2200+level*150?1:0);S.levelStars[level]=Math.max(S.levelStars[level]||0,earned);if(!S.completed.includes(level))S.completed.push(level);if(level>=S.maxLevel)S.maxLevel=Math.min(25,level+1)}save();ov.style.display='flex';let starLine=win&&gameMode==='levels'?'<div style="font-size:24px;color:#ffd763;margin-top:10px">'+('★'.repeat(earned)+'☆'.repeat(3-earned))+'</div>':'';let primary=win&&gameMode==='levels'?(level<25?'NEXT LEVEL':'WORLD COMPLETE!'):'RETRY';let action=win&&gameMode==='levels'?(level<25?()=>run('levels',Math.min(25,level+1)):levelMap):()=>run(gameMode,level);ov.innerHTML='<div class="card"><div class="over">'+(win?'BOSS DEFEATED!':'RUN OVER')+'</div><div class="big">'+(score|0).toLocaleString()+'</div>'+starLine+'<div class="stats"><div class="stat"><b>◆ '+bank+'</b><span>ENERGY BANKED</span></div><div class="stat"><b>'+S.maxLevel+'</b><span>MAX LEVEL</span></div></div><button class="btn" id="primary">'+primary+'</button>'+(gameMode==='levels'?'<button class="btn alt" id="map">WORLD MAP</button>':'')+'<button class="btn alt" id="home">MODE SELECT</button><button class="btn alt" id="upg">⚙︎ WORKSHOP</button></div>';primary.onclick=action;if(gameMode==='levels')map.onclick=levelMap;home.onclick=menu;upg.onclick=()=>workshop('gear')}
function road(z,l=0){let t=Math.pow(clamp(z,0,1),1.55),y=lerp(H*.22,H*1.03,t),half=lerp(W*.05,W*.53,t),w=currentWorld(),amp=gameMode==='levels'?Math.min(W*.24,Math.max(0,level-2)*7):W*.12,curve=0;if(w.curve==='soft')curve=amp*.45*Math.sin(world*.28+z*3)*(1-z*.35);else if(w.curve==='wave')curve=amp*.72*Math.sin(world*.42+z*5.2)*(1-z*.2);else if(w.curve==='sweep')curve=amp*.85*Math.sin(world*.20+z*2.5)*(1-z*.1);else if(w.curve==='snake')curve=amp*Math.sin(world*.55+z*7)*(1-z*.12);else curve=amp*(Math.sin(world*.68+z*8)*.7+Math.sin(world*1.3+z*3)*.3)*(1-z*.08);let cx=W/2+curve;return{x:cx+l*half*.57,y,sc:lerp(.12,1.35,t),half,cx}}
function bg(){let w=currentWorld(),g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,w.sky[0]);g.addColorStop(.58,hyper?'#281347':w.sky[1]);g.addColorStop(1,w.sky[2]);X.fillStyle=g;X.fillRect(0,0,W,H);for(let s of stars){X.globalAlpha=s.a;X.fillStyle=w===WORLDS[1]?'#ffb36a':w===WORLDS[3]?'#baff8b':'#fff';X.fillRect(s.x,s.y,s.s,s.s)}X.globalAlpha=1;for(let i=0;i<14;i++){let p=road(i/13);X.strokeStyle=w.road;X.lineWidth=1+i/13*1.7;X.beginPath();X.moveTo(p.cx-p.half,p.y);X.lineTo(p.cx+p.half,p.y);X.stroke()}for(let l of [-1.5,-.5,.5,1.5]){X.strokeStyle=w.road;X.lineWidth=1;X.beginPath();for(let i=0;i<=18;i++){let p=road(i/18,l);if(i===0)X.moveTo(p.x,p.y);else X.lineTo(p.x,p.y)}X.stroke()}if(gameMode==='levels'){X.globalAlpha=.18;X.fillStyle=w.boss;X.font='1000 44px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';X.textAlign='center';X.fillText(w.name,W/2,H*.16);X.globalAlpha=1}}
function add(kind,l,z=.02){items.push({kind,l,z,spin:Math.random()*6.28})}function spawnWave(sec){let wi=WORLDS.indexOf(currentWorld()),danger=Math.min(.86,.54+sec*.004+(gameMode==='levels'?level*.014:0));if(Math.random()<danger){let lanes=[-1,0,1],l=lanes[Math.random()*3|0],kind=wi===1&&Math.random()<.28?'meteor':wi===2&&Math.random()<.28?'ice':wi===3&&Math.random()<.32?'spore':wi===4&&Math.random()<.36?'void':'block';add(kind,l);let doubleChance=.20+wi*.035;if(sec>14&&Math.random()<doubleChance)add(kind,lanes.filter(v=>v!==l)[Math.random()*2|0],-.06)}else{add('gem',[-1,0,1][Math.random()*3|0]);if(Math.random()<.5)add('gem',[-1,0,1][Math.random()*3|0],-.07)}}
function drawItem(o){let p=road(o.z,o.l),s=p.sc,w=currentWorld();if(o.kind==='attack'){let q=18*s;X.save();X.translate(p.x,p.y);X.rotate(o.spin);X.fillStyle='#ffcf56';X.shadowColor='#ffbe43';X.shadowBlur=22;X.beginPath();X.moveTo(-q*.15,-q);X.lineTo(q*.6,-q*.1);X.lineTo(q*.05,-q*.1);X.lineTo(q*.25,q);X.lineTo(-q*.6,q*.05);X.lineTo(-q*.08,q*.05);X.closePath();X.fill();X.restore()}else if(['block','meteor','ice','spore','void'].includes(o.kind)){let q=34*s;X.save();X.translate(p.x,p.y);X.rotate(.18+o.spin);let col=o.kind==='meteor'?'#ff8a3d':o.kind==='ice'?'#7bd8ff':o.kind==='spore'?'#b8ff4f':o.kind==='void'?'#e867ff':w.haz;X.fillStyle=col;X.shadowColor=col;X.shadowBlur=18*s;if(o.kind==='meteor'){X.beginPath();X.arc(0,0,q*.55,0,Math.PI*2);X.fill()}else if(o.kind==='ice'){X.beginPath();X.moveTo(0,-q*.7);X.lineTo(q*.55,q*.5);X.lineTo(-q*.55,q*.5);X.closePath();X.fill()}else if(o.kind==='spore'){for(let a=0;a<6;a++){X.rotate(Math.PI/3);X.beginPath();X.arc(q*.42,0,q*.22,0,Math.PI*2);X.fill()}X.beginPath();X.arc(0,0,q*.35,0,Math.PI*2);X.fill()}else if(o.kind==='void'){X.strokeStyle=col;X.lineWidth=5;X.beginPath();X.arc(0,0,q*.52,0,Math.PI*1.65);X.stroke()}else{X.fillRect(-q/2,-q/2,q,q)}X.restore()}else{let q=14*s;X.save();X.translate(p.x,p.y);X.rotate(o.spin);X.fillStyle='#67efff';X.shadowColor='#67efff';X.shadowBlur=18*s;X.beginPath();X.moveTo(0,-q);X.lineTo(q,0);X.lineTo(0,q);X.lineTo(-q,0);X.closePath();X.fill();X.restore()}}
function drawPlayer(){let p=road(.84,lane),r=24+S.core*3+(hyper?5:0),cc=COLORS[S.pulseColor]||COLORS.cyan;X.save();X.translate(p.x,p.y);X.shadowColor=hyper?'#ff69ca':cc[3];X.shadowBlur=35;if(S.ballSkin==='tennis'){let g=X.createRadialGradient(-8,-9,2,0,0,r);g.addColorStop(0,'#faffb0');g.addColorStop(.65,'#cbe842');g.addColorStop(1,'#879a18');X.fillStyle=g;X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.strokeStyle='#eef6b8';X.lineWidth=3;X.beginPath();X.arc(-r*.42,0,r*.78,-1.15,1.15);X.stroke();X.beginPath();X.arc(r*.42,0,r*.78,2.0,4.28);X.stroke()}else if(S.ballSkin==='soccer'){X.fillStyle='#f4f4f4';X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.strokeStyle='#d8d8d8';X.lineWidth=2;X.stroke();X.fillStyle='#111';for(let a=0;a<5;a++){let an=a*Math.PI*2/5-world*.8;X.beginPath();X.arc(Math.cos(an)*r*.58,Math.sin(an)*r*.58,r*.18,0,Math.PI*2);X.fill()}X.beginPath();X.arc(0,0,r*.24,0,Math.PI*2);X.fill()}else{let g=X.createRadialGradient(-7,-8,2,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.25,cc[0]);g.addColorStop(.7,hyper?'#ff69ca':cc[1]);g.addColorStop(1,cc[2]);X.fillStyle=g;X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.strokeStyle='#efffff';X.lineWidth=4;X.stroke()}for(let i=0;i<1+Math.floor(evo()/4);i++){X.strokeStyle='rgba(180,130,255,'+(.5-i*.1)+')';X.beginPath();X.ellipse(0,0,r+10+i*7,(r+10+i*7)*.32,world*2+i,0,Math.PI*2);X.stroke()}if(S.shield+(S.equipped==='armor'?1:0)>shieldUsed){X.strokeStyle='#7dffc7';X.lineWidth=3;X.beginPath();X.arc(0,0,r+15,0,Math.PI*2);X.stroke()}if(S.equipped==='drone'){X.fillStyle='#ffd85b';X.beginPath();X.arc(34*Math.cos(world*3),14*Math.sin(world*3),6,0,Math.PI*2);X.fill()}X.restore()}
function startBoss(){items=[];shots=0;bossPending=false;fire.style.display='block';fire.classList.remove('ready');fire.textContent='⚡ 0/3 · SWIPE ↑ TO FIRE';let wi=WORLDS.indexOf(currentWorld()),names=['NEON MANTIS','MAGMA TITAN','ICE CROWN','BLOOM QUEEN','VOID EMPEROR'];boss={hp:16+level*6,max:16+level*6,l:0,t:0,world:wi};bossWrap.style.display='block';bossName.textContent=names[wi]+' · LV '+level;msg(currentWorld().name+' BOSS!','#ff86a5');vib([30,30,70])}
function drawBoss(dt){if(!boss)return;boss.t+=dt;let wi=boss.world,w=WORLDS[wi];boss.l=wi===2?Math.sin(boss.t*.0008)*.55:wi===4?Math.sin(boss.t*.0021)*.88:Math.sin(boss.t*.0014)*.76;let p=road(.22,boss.l),r=32+level*2;X.save();X.translate(p.x,p.y);X.rotate(world*(wi===1?1.7:1));X.fillStyle=w.boss;X.shadowColor=w.boss;X.shadowBlur=38;let arms=wi===3?8:wi===4?4:6;for(let i=0;i<arms;i++){X.rotate(Math.PI*2/arms);X.fillRect(r*.5,-5,r*(wi===4?1.0:.75),10)}X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(0,0,r*.26,0,Math.PI*2);X.fill();X.restore();bossTimer+=dt;let cadence=[800,650,940,720,560][wi];if(bossTimer>cadence){bossTimer=0;let lanes=[-1,0,1],kind=['block','meteor','ice','spore','void'][wi];if(wi===2){add(kind,lanes[Math.random()*3|0],.24);setTimeout(()=>{if(phase==='play'&&boss)add(kind,lanes[Math.random()*3|0],.18)},180)}else if(wi===3){let safe=lanes[Math.random()*3|0];lanes.filter(v=>v!==safe).forEach((l,j)=>add(kind,l,.22-j*.04))}else if(wi===4){add(kind,lanes[Math.random()*3|0],.30);if(Math.random()<.65)add(kind,lanes[Math.random()*3|0],.16)}else add(kind,lanes[Math.random()*3|0],.28);if(Math.random()<.9)add('attack',lanes[Math.random()*3|0],.10)}droneTimer+=dt;if(S.equipped==='drone'&&droneTimer>650){droneTimer=0;damageBoss(1)}if(hyper&&bossTimer<40)damageBoss(S.equipped==='prism'?1.2:.6);bossFill.style.width=Math.max(0,boss.hp/boss.max*100)+'%'}
function damageBoss(d){if(!boss||bossPending)return;boss.hp-=d;score+=25*d;if(boss.hp<=0){bossPending=true;phase='victory';boss=null;fire.style.display='none';bossWrap.style.display='none';score+=1000*level;energy+=10+level*2;msg('BOSS DEFEATED!','#7dffc7');setTimeout(()=>finish(true),900)}}function fireShot(){if(phase!=='play'||!boss||shots<3)return;shots-=3;fire.classList.remove('ready');fire.textContent='⚡ '+shots+'/3 · SWIPE ↑ TO FIRE';projectiles.push({t:0,from:road(.84,lane),to:road(.22,boss.l)});vib(25);msg('PULSE BLAST!','#ffd76c')}
function burst(px,py,col){for(let i=0;i<14;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,l:1,c:col})}function spawnSpecter(){let r=Math.random(),type=r<.45?'cache':r<.78?'ghost':'mimic';specter={t:0,d:type==='mimic'?1900:1500,dir:Math.random()<.5?-1:1,y:H*(.12+Math.random()*.09),pulse:0,type,x:0};nextSpecter=6500+Math.random()*5000}function drawSpecter(dt){if(!specter){nextSpecter-=dt;if(nextSpecter<=0&&phase==='play')spawnSpecter();return}specter.t+=dt;specter.pulse+=dt*.012;let u=specter.t/specter.d;if(u>=1){specter=null;return}let xPos=specter.dir>0?lerp(-70,W+70,u):lerp(W+70,-70,u),yPos=specter.y+Math.sin(u*Math.PI*4)*16;specter.x=xPos;specter.yNow=yPos;let cache=specter.type==='cache',mimic=specter.type==='mimic';X.save();X.translate(xPos,yPos);X.globalAlpha=Math.sin(Math.PI*u)*.95;X.shadowColor=cache?'#67efff':mimic?'#ff4b63':'#ff4fd8';X.shadowBlur=30+10*Math.sin(specter.pulse);let rg=X.createRadialGradient(-8,-6,2,0,0,24);rg.addColorStop(0,'#fff');rg.addColorStop(.25,cache?'#ffe866':mimic?'#ff9977':'#ffec6b');rg.addColorStop(.55,cache?'#61eaff':mimic?'#ff425f':'#ff4fd8');rg.addColorStop(1,cache?'#3b5dff':mimic?'#6b001a':'#6c2cff');X.fillStyle=rg;X.beginPath();X.arc(0,0,18+4*Math.sin(specter.pulse),0,Math.PI*2);X.fill();X.strokeStyle='#fff';X.lineWidth=2;X.beginPath();X.arc(0,0,28+8*Math.sin(specter.pulse*.7),0,Math.PI*2);X.stroke();X.font='900 10px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';X.textAlign='center';X.fillStyle='#fff';let label=cache?'ENERGY CACHE!':mimic?'BOSS SIGNAL?':'GLITCH!';X.fillText(label,0,-38);if(cache){X.font='800 9px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';X.fillStyle='#bffaff';X.fillText('TAP FOR BONUS',0,43)}X.restore();X.globalAlpha=1}function hitSpecter(px,py){if(!specter)return false;let dx=px-specter.x,dy=py-(specter.yNow||specter.y);if(dx*dx+dy*dy>48*48)return false;let type=specter.type;specter=null;specterHits++;if(type==='cache'){energy+=3;boost=Math.min(100,boost+22);score+=500;burst(px,py,'#67efff');msg('ENERGY CACHE +3','#7df5ff');vib([10,20,10]);if(boost>=100&&!hyper){boost=0;hyper=3200;msg('HYPER MODE!','#ff79d3')}}else if(type==='mimic'){msg('DECOY!','#ff6e87');vib([25,20,45]);add('block',[-1,0,1][Math.random()*3|0],.18);if(Math.random()<.65)add('block',[-1,0,1][Math.random()*3|0],.08)}else{score+=75;msg('JUST STATIC','#c3b8ff')}update();return true}function msg(t,c){if(toastAnimation)toastAnimation.cancel();toast.textContent=t;toast.style.color=c;toast.style.opacity='0';toastAnimation=toast.animate([{opacity:0,offset:0},{opacity:1,offset:.12},{opacity:1,offset:.65},{opacity:0,offset:1}],{duration:2200,fill:'forwards'});toastAnimation.onfinish=()=>{toast.style.opacity='0';toastAnimation=null}}function update(){scoreEl.textContent=(score|0).toLocaleString();eg.textContent='◆ '+energy;comboEl.textContent='×'+combo;fill.style.width=boost+'%'}
function loop(t){if(phase!=='play')return;let dt=Math.min(33,t-last);last=t;let sec=(t-start)/1000;world+=dt/1000;lane=lerp(lane,target,Math.min(1,dt*.012));let speed=Math.min(.014,.006+sec*.00006)+(hyper?.0025:0);if(gameMode==='levels'&&!boss&&sec>24+level*3)startBoss();spawn+=dt;if(!boss&&spawn>Math.max(390,780-sec*4)){spawn=0;spawnWave(sec)}bg();let crash=false;for(let i=items.length-1;i>=0;i--){let o=items[i];o.z+=speed*dt/16;o.spin+=.05*dt/16;drawItem(o);if(o.z>.78&&o.z<.91){let dist=Math.abs(o.l-lane),mag=.22+S.magnet*.34+(S.equipped==='gravity'?.35:0);if(o.kind==='attack'&&dist<.45){let p=road(o.z,o.l);shots=Math.min(3,shots+1);fire.textContent=shots>=3?'⚡ READY · SWIPE ↑ TO FIRE':'⚡ '+shots+'/3 · SWIPE ↑ TO FIRE';fire.classList.toggle('ready',shots>=3);burst(p.x,p.y,'#ffd75f');items.splice(i,1);vib(9);continue}if(o.kind==='gem'&&dist<mag){let p=road(o.z,o.l);energy++;combo=Math.min(9,combo+1);boost=Math.min(100,boost+15+S.charge*7);score+=70*combo*(1+S.multi*.15);burst(p.x,p.y,'#67efff');items.splice(i,1);if(boost>=100&&!hyper){boost=0;hyper=3200;msg('HYPER MODE!','#ff79d3')}continue}if(['block','meteor','ice','spore','void'].includes(o.kind)&&dist<.27){let protection=S.shield+(S.equipped==='armor'?1:0);if(protection>shieldUsed){shieldUsed++;items.splice(i,1);msg('SHIELD SAVE!','#78ffc5');continue}else crash=true}}if(o.z>1.08)items.splice(i,1)}if(hyper>0){hyper-=dt;if(hyper<0)hyper=0}drawSpecter(dt);if(boss)drawBoss(dt);drawPlayer();for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.t+=dt/380;let dest=boss?road(.22,boss.l):p.to;let px=lerp(p.from.x,dest.x,p.t),py=lerp(p.from.y,dest.y,p.t);X.fillStyle='#ffd36b';X.shadowColor='#ffb33d';X.shadowBlur=20;X.beginPath();X.arc(px,py,9,0,Math.PI*2);X.fill();X.shadowBlur=0;if(p.t>=1){projectiles.splice(i,1);burst(px,py,'#ffd75f');damageBoss(5+S.core*2)}}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.04;X.globalAlpha=p.l;X.fillStyle=p.c;X.fillRect(p.x,p.y,3,3);if(p.l<=0)parts.splice(i,1)}X.globalAlpha=1;score+=dt/16*(1+S.multi*.15)*(hyper?2:1);update();if(crash)return finish(false);raf=requestAnimationFrame(loop)}
q('g').addEventListener('pointerdown',e=>{if(phase!=='play'||e.target.tagName==='BUTTON')return;pointerStart={x:e.clientX,y:e.clientY,t:performance.now()}});q('g').addEventListener('pointerup',e=>{if(phase!=='play'||!pointerStart||e.target.tagName==='BUTTON'){pointerStart=null;return}let dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y,dt=performance.now()-pointerStart.t;pointerStart=null;if(Math.abs(dx)<28&&Math.abs(dy)<28&&hitSpecter(e.clientX,e.clientY))return;if(boss&&shots>=3&&dy<-45&&Math.abs(dy)>Math.abs(dx)*1.15&&dt<650){fireShot();return}if(Math.abs(dx)<28&&Math.abs(dy)<28){target=clamp(target+(e.clientX<W/2?-1:1),-1,1);vib(5)}});menu()})();
