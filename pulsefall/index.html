<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pulsefall</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070A12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;touch-action:none}#g{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 15% 5%,#10213a 0,transparent 34%),radial-gradient(circle at 90% 100%,#211537 0,transparent 40%),#070A12}.lane{position:absolute;top:105px;bottom:70px;width:1px;background:#1a2236}.hud{position:absolute;top:max(24px,env(safe-area-inset-top));left:24px;right:24px;display:flex;justify-content:space-between;z-index:3}.lab{font-size:10px;color:#8c98b3;letter-spacing:2px;font-weight:800}.score{font-size:30px;font-weight:900}.combo{text-align:right;color:#fcd34d;font-size:28px;font-weight:900}.player{position:absolute;width:56px;height:56px;border-radius:50%;background:#67e8f91c;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 16px #67e8f9);transition:left .08s cubic-bezier(.2,.8,.2,1)}.player:after{content:"";width:28px;height:28px;border-radius:50%;background:#67e8f9;border:5px solid #d8fbff}.haz{position:absolute;width:36px;height:36px;border-radius:9px;background:#fb7185;border:4px solid #ffb0bc;transform:rotate(12deg);box-shadow:0 0 12px #fb718555}.shard{position:absolute;width:20px;height:20px;background:#60a5fa;border:3px solid #c7edff;transform:rotate(45deg);box-shadow:0 0 12px #60a5fa}.overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#070a12dd;z-index:10;padding:28px}.card{text-align:center;width:100%;max-width:420px}.logo{font-size:40px;font-weight:1000;letter-spacing:5px}.tag{color:#8c98b3;margin-top:8px;font-size:13px;letter-spacing:1.3px;font-weight:800}.orb{width:110px;height:110px;border-radius:55px;background:#67e8f914;margin:38px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 38px #67e8f955}.orb:after{content:"";width:56px;height:56px;border-radius:50%;background:#67e8f9;border:8px solid #d8fbff}.info{color:#b8c2d8;line-height:1.55}.btn{margin-top:30px;width:220px;height:58px;border:0;border-radius:18px;font-weight:900;letter-spacing:1.5px;font-size:15px;background:#fff;color:#071019}.best{margin-top:20px;color:#8c98b3;font-size:11px;letter-spacing:2px;font-weight:800}.over{color:#fb7185;font-size:18px;letter-spacing:3px;font-weight:900}.big{font-size:58px;font-weight:1000;margin-top:14px}.stats{display:flex;gap:14px;justify-content:center;margin-top:30px}.stat{width:130px;height:82px;border-radius:18px;background:#101524;border:1px solid #1a2236;display:flex;flex-direction:column;justify-content:center}.stat b{font-size:22px}.hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;justify-content:space-between;color:#39445d;font-size:11px;letter-spacing:2px;font-weight:800}.bar{position:absolute;top:94px;left:24px;right:24px;height:3px;background:#121a29}.fill{height:100%;background:#67e8f9;width:0}
</style></head><body><div id="g"><div class="lane" id="a"></div><div class="lane" id="b"></div><div class="hud" id="hud" style="display:none"><div><div class="lab">SCORE</div><div class="score" id="sc">0</div></div><div><div class="combo" id="co">×1</div><div class="lab" style="text-align:right">COMBO</div></div></div><div class="bar" id="bar" style="display:none"><div class="fill" id="fill"></div></div><div class="player" id="p" style="display:none"></div><div class="hint" id="hint" style="display:none"><span>‹ TAP</span><span>TAP ›</span></div><div class="overlay" id="ov"></div></div><script>
(()=>{const g=document.getElementById('g'),ov=document.getElementById('ov'),p=document.getElementById('p'),sc=document.getElementById('sc'),co=document.getElementById('co'),hud=document.getElementById('hud'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),hint=document.getElementById('hint'),a=document.getElementById('a'),b=document.getElementById('b');let phase='start',lane=1,items=[],score=0,best=+(localStorage.pfBest||0),shards=0,combo=1,speed=4.3,start=0,last=0,spawn=0,raf=0;
const D=()=>{let w=innerWidth,h=innerHeight,pad=24,lw=(w-pad*2)/3;return{w,h,pad,lw,py:Math.min(h-180,640),x:i=>pad+i*lw+lw/2}};function layout(){let d=D();a.style.left=d.pad+d.lw+'px';b.style.left=d.pad+d.lw*2+'px';p.style.top=d.py-28+'px';p.style.left=d.x(lane)-28+'px'}addEventListener('resize',layout);function vib(x){try{navigator.vibrate&&navigator.vibrate(x)}catch{}}
function menu(){ov.style.display='flex';ov.innerHTML='<div class="card"><div class="logo">PULSEFALL</div><div class="tag">DODGE. COLLECT. ACCELERATE.</div><div class="orb"></div><div class="info">Tap left or right to switch lanes.<br>Collect blue shards. Avoid red blocks.</div><button class="btn" id="go">START RUN</button><div class="best">BEST&nbsp;&nbsp;'+best.toLocaleString()+'</div></div>';document.getElementById('go').onclick=run}
function run(){cancelAnimationFrame(raf);document.querySelectorAll('.haz,.shard').forEach(x=>x.remove());phase='play';lane=1;items=[];score=0;shards=0;combo=1;speed=4.3;spawn=0;start=last=performance.now();ov.style.display='none';hud.style.display='flex';bar.style.display='block';p.style.display='flex';hint.style.display='flex';sc.textContent=0;co.textContent='×1';layout();vib(15);raf=requestAnimationFrame(loop)}
function end(){if(phase!=='play')return;phase='over';cancelAnimationFrame(raf);best=Math.max(best,score|0);localStorage.pfBest=best;vib([40,40,80]);ov.style.display='flex';ov.innerHTML='<div class="card"><div class="over">RUN OVER</div><div class="big">'+(score|0).toLocaleString()+'</div><div class="lab">SCORE</div><div class="stats"><div class="stat"><b>'+best.toLocaleString()+'</b><span class="lab">BEST</span></div><div class="stat"><b>'+shards+'</b><span class="lab">SHARDS</span></div></div><button class="btn" id="again">RUN AGAIN</button></div>';document.getElementById('again').onclick=run}
function add(kind,l,y=-70){let d=document.createElement('div');d.className=kind==='haz'?'haz':'shard';g.appendChild(d);let o={kind,l,y,el:d,counted:false};items.push(o);pos(o);return o}function pos(o){let d=D(),s=o.kind==='haz'?36:20;o.el.style.left=d.x(o.l)-s/2+'px';o.el.style.top=o.y-s/2+'px'}
function loop(t){if(phase!=='play')return;let dt=Math.min(32,t-last);last=t;let e=(t-start)/1000;speed=Math.min(10.5,4.3+e*.055);fill.style.width=Math.min(100,(speed-4.3)/6.2*100)+'%';spawn+=dt;let every=Math.max(350,740-e*5.5);if(spawn>=every){spawn=0;let hl=Math.random()*3|0;if(Math.random()<Math.min(.84,.62+e*.002)){add('haz',hl);if(e>18&&Math.random()<.32){let x=Math.random()*3|0;while(x===hl)x=Math.random()*3|0;add('haz',x,-120)}}if(Math.random()<.48){let x=Math.random()*3|0;if(x===hl&&Math.random()<.8)x=(x+1+(Math.random()*2|0))%3;add('shard',x,-50)}}let d=D(),dead=false,gain=dt/16;for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=speed*dt/16;pos(o);let dx=Math.abs(d.x(o.l)-d.x(lane)),dy=Math.abs(o.y-d.py);if(o.kind==='haz'&&dx<24&&dy<30){dead=true;o.el.remove();items.splice(i,1);continue}if(o.kind==='shard'&&dx<28&&dy<34){shards++;gain+=80*combo;combo=Math.min(8,combo+1);co.textContent='×'+combo;vib(10);o.el.remove();items.splice(i,1);continue}if(o.kind==='haz'&&!o.counted&&o.y>d.py+42&&o.y<d.py+60){if(o.l!==lane&&Math.abs(o.l-lane)===1)gain+=12*combo;o.counted=true}if(o.y>d.h+70){o.el.remove();items.splice(i,1)}}score+=gain;sc.textContent=(score|0).toLocaleString();if(Math.random()<.004&&combo>1){combo--;co.textContent='×'+combo}if(dead)return end();raf=requestAnimationFrame(loop)}
function tap(x){if(phase!=='play')return;let n=x<innerWidth/2?lane-1:lane+1,nc=Math.max(0,Math.min(2,n));if(nc!==lane){lane=nc;layout();vib(6)}}g.addEventListener('pointerdown',e=>tap(e.clientX));layout();menu()})()
</script></body></html>
