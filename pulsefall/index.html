<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pulsefall Evolve</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;touch-action:none}#g{position:fixed;inset:0;background:linear-gradient(#070b20,#120c25 65%,#070810);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;z-index:5;display:none;justify-content:space-between}.lab{font-size:10px;letter-spacing:2px;color:#91a0c5;font-weight:900}.score{font-size:30px;font-weight:1000}.combo{text-align:right;color:#ffd45f;font-size:25px;font-weight:1000}.energy{margin-top:4px;color:#67e8f9;font-weight:900;font-size:13px}.bar{position:absolute;top:max(84px,calc(env(safe-area-inset-top) + 67px));left:20px;right:20px;height:5px;background:#ffffff12;border-radius:99px;overflow:hidden;display:none;z-index:5}.fill{height:100%;width:0;background:linear-gradient(90deg,#5fe9ff,#8a63ff,#ff67c7)}.hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:20px;right:20px;display:none;justify-content:space-between;color:#ffffff3c;font-size:10px;letter-spacing:2px;font-weight:900;z-index:5}.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:#050816dd;overflow:auto}.card{width:100%;max-width:430px;text-align:center}.logo{font-size:39px;font-weight:1000;letter-spacing:3px}.logo span{background:linear-gradient(90deg,#5fe9ff,#9675ff,#ff6cc9);-webkit-background-clip:text;color:transparent}.tag{margin-top:8px;font-size:11px;letter-spacing:1.8px;color:#92a0c5;font-weight:900}.orb{width:118px;height:118px;border-radius:50%;margin:30px auto;background:radial-gradient(circle at 35% 28%,#fff 0 5%,#67e8f9 6% 22%,#6c61ff 48%,#261249 75%);box-shadow:0 0 25px #67e8f9,0 0 70px #8b65ff66;position:relative;animation:bob 1.8s ease-in-out infinite}.orb:after{content:"";position:absolute;width:150px;height:34px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-15deg);border:5px solid #ff69c9;border-radius:50%;box-shadow:0 0 18px #ff69c9}@keyframes bob{50%{transform:translateY(-7px)}}.info{color:#bcc7df;line-height:1.5;font-size:15px}.btn{margin-top:20px;width:min(265px,84vw);height:58px;border:0;border-radius:19px;background:linear-gradient(90deg,#5fe9ff,#8566ff 55%,#ff6bc9);color:#fff;font-weight:1000;font-size:14px;letter-spacing:1.3px}.btn.alt{margin-top:11px;background:#ffffff0d;border:1px solid #ffffff18}.wallet{margin-top:16px;color:#68eaff;font-size:13px;font-weight:900}.small{margin-top:9px;color:#8594b8;font-size:11px}.shopTitle{font-size:26px;font-weight:1000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.up{padding:13px;border-radius:17px;background:#ffffff0b;border:1px solid #ffffff17;text-align:left}.up .ico{font-size:24px}.up h3{font-size:13px;margin:7px 0 3px}.up p{font-size:10px;color:#9ba8c8;line-height:1.35;min-height:39px;margin:0}.lvl{float:right;color:#72efff;font-size:10px}.up button{width:100%;margin-top:9px;padding:9px 3px;border:0;border-radius:10px;background:#7067ff;color:white;font-size:10px;font-weight:900}.up button:disabled{opacity:.3}.over{color:#ff7093;font-size:17px;letter-spacing:3px;font-weight:1000}.big{font-size:56px;font-weight:1000;margin-top:10px}.stats{display:flex;gap:10px;justify-content:center;margin-top:22px}.stat{width:125px;height:72px;border:1px solid #ffffff17;border-radius:17px;background:#ffffff0a;display:flex;flex-direction:column;justify-content:center}.stat b{font-size:20px}.stat span{font-size:9px;color:#91a0c7;letter-spacing:1px;margin-top:3px;font-weight:900}#toast{position:absolute;z-index:8;left:50%;top:26%;transform:translate(-50%,-50%);font-size:23px;font-weight:1000;pointer-events:none}
</style></head><body><div id="g"><canvas id="c"></canvas><div class="hud" id="hud"><div><div class="lab">SCORE</div><div class="score" id="score">0</div><div class="energy" id="eg">◆ 0</div></div><div><div class="combo" id="combo">×1</div><div class="lab" style="text-align:right">COMBO</div></div></div><div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="hint" id="hint"><span>‹ TAP LEFT</span><span>TAP RIGHT ›</span></div><div id="toast"></div><div class="ov" id="ov"></div></div><script>
(()=>{const C=document.getElementById('c'),X=C.getContext('2d'),ov=document.getElementById('ov'),hud=document.getElementById('hud'),scoreEl=document.getElementById('score'),eg=document.getElementById('eg'),comboEl=document.getElementById('combo'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),hint=document.getElementById('hint'),toast=document.getElementById('toast');let W,H,dpr,phase='menu',lane=0,target=0,score=0,energy=0,combo=1,boost=0,hyper=0,speed=.006,items=[],parts=[],stars=[],spawn=0,start=0,last=0,world=0,shieldUsed=0,raf=0;const base={wallet:0,best:0,shield:0,magnet:0,charge:0,multi:0,core:0};let S={...base,...JSON.parse(localStorage.pfEvo||'{}')};const save=()=>localStorage.pfEvo=JSON.stringify(S),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H*.7,s:Math.random()*1.6+.4,a:Math.random()*.65+.2}))}addEventListener('resize',resize);resize();function vib(v){try{navigator.vibrate&&navigator.vibrate(v)}catch{}}function totalLvl(){return S.shield+S.magnet+S.charge+S.multi+S.core}
const upgrades=[['shield','🛡️','Shield','Absorb crashes.',[35,90,220]],['magnet','🧲','Magnet','Pull crystals from nearby lanes.',[30,80,190]],['charge','⚡','Hyper Charge','Reach Hyper Mode faster.',[25,75,180]],['multi','✦','Multiplier','Permanent score bonus.',[40,110,250]],['core','◉','Core Evolution','Bigger Pulse and more energy.',[45,130,300]]];
function menu(){phase='menu';hud.style.display=bar.style.display=hint.style.display='none';ov.style.display='flex';ov.innerHTML='<div class="card"><div class="logo"><span>PULSEFALL</span> EVOLVE</div><div class="tag">RUN • COLLECT • UPGRADE • EVOLVE</div><div class="orb"></div><div class="info">Your Pulse now gets stronger over time.<br>Collect energy and permanently evolve it.</div><button class="btn" id="play">START RUN</button><button class="btn alt" id="shop">⚙︎ PULSE WORKSHOP</button><div class="wallet">◆ '+S.wallet.toLocaleString()+' ENERGY</div><div class="small">EVOLUTION '+totalLvl()+' · BEST '+S.best.toLocaleString()+'</div></div>';play.onclick=run;shop.onclick=workshop}
function workshop(){phase='shop';let cards=upgrades.map(u=>{let [k,ic,n,d,costs]=u,lv=S[k],max=lv>=3,c=max?'MAX':costs[lv];return '<div class="up"><div class="ico">'+ic+'<span class="lvl">LV '+lv+'/3</span></div><h3>'+n+'</h3><p>'+d+'</p><button data-k="'+k+'" '+(max||S.wallet<c?'disabled':'')+'>'+(max?'MAXED':'UPGRADE ◆ '+c)+'</button></div>'}).join('');ov.innerHTML='<div class="card"><div class="shopTitle">PULSE WORKSHOP</div><div class="wallet">◆ '+S.wallet.toLocaleString()+' ENERGY</div><div class="grid">'+cards+'</div><button class="btn alt" id="back">BACK</button></div>';ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>buy(b.dataset.k));back.onclick=menu}
function buy(k){let u=upgrades.find(z=>z[0]===k),lv=S[k];if(lv>=3)return;let cost=u[4][lv];if(S.wallet<cost)return;S.wallet-=cost;S[k]++;save();vib(15);workshop()}
function run(){phase='play';ov.style.display='none';hud.style.display='flex';bar.style.display='block';hint.style.display='flex';lane=target=0;score=energy=0;combo=1;boost=hyper=0;speed=.006;items=[];parts=[];spawn=0;start=last=performance.now();world=0;shieldUsed=0;update();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){phase='over';cancelAnimationFrame(raf);S.best=Math.max(S.best,score|0);let bank=Math.floor(energy*(1+S.core*.25));S.wallet+=bank;save();vib([50,40,100]);ov.style.display='flex';ov.innerHTML='<div class="card"><div class="over">RUN OVER</div><div class="big">'+(score|0).toLocaleString()+'</div><div class="lab">SCORE</div><div class="stats"><div class="stat"><b>◆ '+bank+'</b><span>ENERGY BANKED</span></div><div class="stat"><b>'+S.best.toLocaleString()+'</b><span>BEST</span></div></div><button class="btn" id="again">RUN AGAIN</button><button class="btn alt" id="upg">⚙︎ UPGRADE PULSE</button></div>';again.onclick=run;upg.onclick=workshop}
function road(z,l=0){let hz=H*.22,t=Math.pow(clamp(z,0,1),1.55),y=lerp(hz,H*1.03,t),half=lerp(W*.05,W*.53,t),cx=W/2+Math.sin(world*.35)*8*(1-t);return{x:cx+l*half*.57,y,sc:lerp(.12,1.35,t),half,cx}}
function bg(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05091b');g.addColorStop(.55,hyper?'#241144':'#0b1230');g.addColorStop(1,'#090711');X.fillStyle=g;X.fillRect(0,0,W,H);for(let s of stars){X.globalAlpha=s.a;X.fillStyle='#fff';X.fillRect(s.x,s.y,s.s,s.s)}X.globalAlpha=1;for(let i=0;i<14;i++){let p=road(i/13);X.strokeStyle='rgba(110,120,255,'+(.05+i/13*.18)+')';X.lineWidth=1+i/13*2;X.beginPath();X.moveTo(p.cx-p.half,p.y);X.lineTo(p.cx+p.half,p.y);X.stroke()}for(let l of [-1.5,-.5,.5,1.5]){let a=road(0,l),b=road(1,l);X.strokeStyle='rgba(95,232,255,.14)';X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke()}}
function add(kind,l,z=.02){items.push({kind,l,z,spin:Math.random()*6.28})}function spawnWave(sec){if(Math.random()<.58){let l=[-1,0,1][Math.random()*3|0];add('block',l);if(sec>18&&Math.random()<.32){let b=[-1,0,1].filter(v=>v!==l)[Math.random()*2|0];add('block',b,-.06)}}else{add('gem',[-1,0,1][Math.random()*3|0]);if(Math.random()<.5)add('gem',[-1,0,1][Math.random()*3|0],-.07)}}
function item(o){let p=road(o.z,o.l),s=p.sc;if(o.kind==='block'){let q=34*s;X.save();X.translate(p.x,p.y);X.rotate(.18+o.spin);X.fillStyle='#ff537e';X.shadowColor='#ff537e';X.shadowBlur=18*s;X.fillRect(-q/2,-q/2,q,q);X.strokeStyle='#ffc4d2';X.lineWidth=Math.max(1,3*s);X.strokeRect(-q/2,-q/2,q,q);X.restore()}else{let q=14*s;X.save();X.translate(p.x,p.y);X.rotate(o.spin);X.fillStyle='#67efff';X.shadowColor='#67efff';X.shadowBlur=18*s;X.beginPath();X.moveTo(0,-q);X.lineTo(q,0);X.lineTo(0,q);X.lineTo(-q,0);X.closePath();X.fill();X.strokeStyle='#eaffff';X.stroke();X.restore()}}
function player(){let p=road(.84,lane),r=24+S.core*3+(hyper?5:0);X.save();X.translate(p.x,p.y);let g=X.createRadialGradient(-7,-8,2,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.25,'#6ef2ff');g.addColorStop(.7,hyper?'#ff69ca':'#655fff');g.addColorStop(1,'#25154c');X.fillStyle=g;X.shadowColor=hyper?'#ff69ca':'#65eaff';X.shadowBlur=35;X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.strokeStyle='#efffff';X.lineWidth=4;X.stroke();for(let i=0;i<1+Math.floor(totalLvl()/4);i++){X.strokeStyle='rgba(180,130,255,'+(.5-i*.1)+')';X.lineWidth=2;X.beginPath();X.ellipse(0,0,r+10+i*7,(r+10+i*7)*.32,world*2+i,0,Math.PI*2);X.stroke()}if(S.shield>shieldUsed){X.strokeStyle='#7dffc7';X.lineWidth=3;X.beginPath();X.arc(0,0,r+15,0,Math.PI*2);X.stroke()}X.restore()}
function burst(px,py,col){for(let i=0;i<16;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,l:1,c:col})}function msg(t,col){toast.textContent=t;toast.style.color=col;toast.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.7)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.15)'},{opacity:0,transform:'translate(-50%,-75%) scale(1)'}],{duration:800})}function update(){scoreEl.textContent=(score|0).toLocaleString();eg.textContent='◆ '+energy;comboEl.textContent='×'+combo;fill.style.width=boost+'%'}
function loop(t){if(phase!=='play')return;let dt=Math.min(33,t-last);last=t;let sec=(t-start)/1000;world+=dt/1000;lane=lerp(lane,target,Math.min(1,dt*.012));speed=Math.min(.014,.006+sec*.00006)+(hyper?.0025:0);spawn+=dt;if(spawn>Math.max(390,780-sec*4)){spawn=0;spawnWave(sec)}bg();let crash=false;for(let i=items.length-1;i>=0;i--){let o=items[i];o.z+=speed*dt/16;o.spin+=.05*dt/16;item(o);if(o.z>.78&&o.z<.91){let dist=Math.abs(o.l-lane);if(o.kind==='gem'&&dist<.22+S.magnet*.34){let p=road(o.z,o.l);energy++;combo=Math.min(9,combo+1);boost=Math.min(100,boost+15+S.charge*7);score+=70*combo*(1+S.multi*.15);burst(p.x,p.y,'#67efff');items.splice(i,1);vib(8);if(boost>=100&&!hyper){boost=0;hyper=3200;msg('HYPER MODE!','#ff79d3')}continue}if(o.kind==='block'&&dist<.27){if(S.shield>shieldUsed){shieldUsed++;let p=road(o.z,o.l);burst(p.x,p.y,'#78ffc5');items.splice(i,1);msg('SHIELD SAVE!','#78ffc5');vib([15,20,15]);continue}else crash=true}}if(o.z>1.08)items.splice(i,1)}if(hyper>0){hyper-=dt;if(hyper<0)hyper=0}player();for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.04;X.globalAlpha=p.l;X.fillStyle=p.c;X.fillRect(p.x,p.y,3,3);if(p.l<=0)parts.splice(i,1)}X.globalAlpha=1;score+=dt/16*(1+S.multi*.15)*(hyper?2:1);update();if(crash)return end();raf=requestAnimationFrame(loop)}
document.getElementById('g').addEventListener('pointerdown',e=>{if(phase!=='play'||e.target.tagName==='BUTTON')return;target=clamp(target+(e.clientX<W/2?-1:1),-1,1);vib(5)});menu()})();
</script></body></html>
